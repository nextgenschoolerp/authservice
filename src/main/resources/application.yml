spring:
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java,src/main/resources
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true
  application:
    name: authservice
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/datasource}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${SERVER_PORT:8082}
  servlet:
    # All endpoints are served under http://localhost:8082/authservice (e.g. /authservice/api/v1/auth/login)
    context-path: ${SERVER_CONTEXT_PATH:/authservice}

jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
  expiration: ${JWT_EXPIRATION:1800000}

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      consume: [w3c, b3]
      produce: [w3c, b3]

logging:
  level:
    root: info
    com.kvs: debug
    com.kvs.core.logging.RequestAndRepositoryLoggingAspect: debug
    org.springframework.security: debug

kvs:
  integrations:
    # 32 random bytes, base64: encrypts the saved email / SMS / WhatsApp secrets (Settings → Integrations)
    secret-key: ${KVS_INTEGRATIONS_KEY:}
  internal:
    # shared with admissionservice / financeservice: lets a scheduled job send email without a signed-in user
    key: ${KVS_INTERNAL_KEY:schoolerp-dev-internal-key}
